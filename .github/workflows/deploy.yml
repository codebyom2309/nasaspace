name: Test and Build CI - Team Turbobits

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-mission-architect
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
